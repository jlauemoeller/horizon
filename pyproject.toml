[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon"
version = "0.1.0"
description = "Command line podcast generator: Claude writes the script, ElevenLabs voices it"
requires-python = ">=3.10"
dependencies = ["pydub>=0.25.1", "anthropic>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
horizon = "horizon.cli:main"

[tool.setuptools.packages.find]
include = ["horizon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
horizon = ["prompt.md"]
